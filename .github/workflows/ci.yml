name: CI/CD

on:
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Run linting
        run: pnpm db:generate

      - name: Check formatting
        run: pnpm lint

      - name: Check types
        run: pnpm typecheck
